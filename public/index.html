<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suivi remboursement</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          paper: '#f7f4ed',
          card: '#ffffff',
          border: '#dfddd5',
          teal: {
            DEFAULT: '#176b68',
            50: '#e7f1f0',
            600: '#176b68',
            700: '#125552'
          },
          coral: {
            DEFAULT: '#e9604c',
            50: '#fdeee9',
            600: '#e9604c',
            700: '#c94a37'
          },
          ink: '#172235',
          muted: '#687384',
          mama: {
            50: '#fff6f3',
            200: '#f1c6bd',
            700: '#b34130'
          },
          victor: {
            50: '#fffaf0',
            200: '#ead7b8',
            700: '#69462b'
          }
        },
        fontFamily: {
          sans: ['"DM Sans"', 'sans-serif'],
          serif: ['"Fraunces"', 'serif']
        },
        borderRadius: {
          '2xl': '1rem'
        }
      }
    }
  };
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="font-sans bg-paper text-ink min-h-screen transition-colors duration-300">

  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

  <header class="border-b border-border bg-card/80 backdrop-blur sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">Suivi remboursement</h1>
        <p class="text-muted text-sm mt-1">Suis les remboursements en famille, en toute transparence.</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="dark-toggle" class="w-10 h-10 rounded-2xl border border-border bg-card flex items-center justify-center hover:shadow-md transition" title="Mode sombre">
          <i data-lucide="moon" class="w-5 h-5"></i>
        </button>
        <button id="new-project-btn" class="hidden sm:flex items-center gap-2 bg-teal text-white px-4 py-2.5 rounded-2xl font-medium hover:bg-teal-700 transition shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Nouveau projet
        </button>
        <button id="new-project-btn-mobile" class="sm:hidden w-10 h-10 rounded-2xl bg-teal text-white flex items-center justify-center">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 space-y-6"></main>

  <footer class="max-w-6xl mx-auto px-4 sm:px-6 py-10 text-center text-xs text-muted">
    Suivi remboursement — données conservées en base MariaDB.
  </footer>

  <!-- Modale : échéances du mois à régler -->
  <div id="settlement-modal-root"></div>

  <!-- Modale : code d'accès -->
  <div id="code-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-ink/40 backdrop-modal" data-close-code-modal></div>
    <div class="relative bg-card rounded-2xl shadow-xl border border-border max-w-sm w-full p-6 animate-pop">
      <h3 id="code-modal-title" class="font-serif text-xl font-semibold mb-1">Code d'accès</h3>
      <p id="code-modal-subtitle" class="text-sm text-muted mb-4">Entre le code pour continuer.</p>
      <input id="code-modal-input" type="password" inputmode="text" class="w-full border border-border rounded-2xl px-4 py-2.5 mb-2 focus:outline-none focus:ring-2 focus:ring-teal/40" placeholder="Code" />
      <p id="code-modal-error" class="hidden text-coral-700 text-sm mb-2">Code incorrect.</p>
      <div class="flex gap-2 mt-4">
        <button data-close-code-modal class="flex-1 border border-border rounded-2xl py-2.5 font-medium hover:bg-paper transition">Annuler</button>
        <button id="code-modal-confirm" class="flex-1 bg-teal text-white rounded-2xl py-2.5 font-medium hover:bg-teal-700 transition">Valider</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
